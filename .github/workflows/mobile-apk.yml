name: Mobile · Build APK + Release

# Construit l'APK Android de Bird (Expo prebuild + Gradle) et l'attache à une Release GitHub.
# Déclenché par un tag :  git tag v1.1.0 && git push origin v1.1.0   (ou manuellement).
# Signature : la clé de debug du modèle Expo est identique à chaque build, les mises à jour s'installent donc
# par-dessus. Pour une publication sur le Play Store, ajouter une vraie clé de signature.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    name: APK release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_USE_MOCK: "0"
      EXPO_PUBLIC_API_BASE_URL: https://bird-roan-six.vercel.app
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dépendances
        run: npm ci --no-audit --no-fund

      - name: Projet Android natif (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Build APK (arm64 + armeabi-v7a)
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon --console=plain

      - name: Préparer l'artefact
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ../bird.apk
          ls -lh ../bird.apk

      - name: Publier la Release + APK
        uses: softprops/action-gh-release@v2
        with:
          files: bird.apk
          name: Bird ${{ github.ref_name }}
          generate_release_notes: true
