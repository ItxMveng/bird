name: Enchères · clôture planifiée

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Clôturer les enchères échues
        env:
          BIRD_API_URL: ${{ vars.BIRD_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BIRD_API_URL" ]; then echo "Variable BIRD_API_URL non définie : rien à faire."; exit 0; fi
          curl -fsS -m 60 --retry 2 -H "Authorization: Bearer ${CRON_SECRET}" "${BIRD_API_URL%/}/cron" || echo "Appel échoué, nouvelle tentative dans 5 min."
